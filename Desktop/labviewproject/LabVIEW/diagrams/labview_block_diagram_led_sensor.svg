<svg width="1400" height="1800" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1800">
  <!-- Définitions de styles -->
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #333; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; fill: #555; }
      .label { font-family: Arial, sans-serif; font-size: 14px; fill: #333; }
      .small-label { font-family: Arial, sans-serif; font-size: 12px; fill: #555; }
      .code { font-family: Courier New, monospace; font-size: 13px; fill: #000; }
      
      /* Couleurs LabVIEW */
      .labview-beige { fill: #F5E6D3; stroke: #8B7355; stroke-width: 2; }
      .labview-blue { fill: #B8D4E8; stroke: #4682B4; stroke-width: 2; }
      .labview-grey { fill: #E0E0E0; stroke: #808080; stroke-width: 2; }
      .labview-white { fill: #FFFFFF; stroke: #999; stroke-width: 1; }
      .labview-yellow { fill: #FFFACD; stroke: #DAA520; stroke-width: 1; }
      
      /* Wires (fils) */
      .wire-orange { stroke: #FF8C00; stroke-width: 2; fill: none; }
      .wire-blue { stroke: #4169E1; stroke-width: 2; fill: none; }
      .wire-red { stroke: #DC143C; stroke-width: 2; fill: none; }
      .wire-purple { stroke: #9370DB; stroke-width: 2; fill: none; }
      .wire-green { stroke: #32CD32; stroke-width: 2; fill: none; }
      
      /* Marqueurs de flèches */
      .arrow { fill: #333; }
    </style>
    
    <!-- Marqueurs de flèches -->
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" class="arrow" />
    </marker>
  </defs>
  
  <!-- Titre principal -->
  <text x="700" y="35" text-anchor="middle" class="title">LabVIEW Block Diagram - LED + Capteur</text>
  <text x="700" y="60" text-anchor="middle" class="subtitle">Communication Série Arduino (Protocole L1/L0/R/S)</text>
  
  <!-- ========== SECTION 1: INITIALIZATION ========== -->
  <g id="init-section">
    <!-- Bordure de section -->
    <rect x="50" y="90" width="1300" height="180" class="labview-grey" rx="5"/>
    <text x="700" y="115" text-anchor="middle" class="label" font-weight="bold">SECTION 1: INITIALIZATION (First Call Only)</text>
    
    <!-- First Call? -->
    <rect x="80" y="140" width="120" height="50" class="labview-white" rx="3"/>
    <text x="140" y="170" text-anchor="middle" class="small-label">First Call?</text>
    
    <!-- VISA Configure Serial Port -->
    <rect x="250" y="130" width="900" height="120" class="labview-blue" rx="5"/>
    <text x="700" y="155" text-anchor="middle" class="label" font-weight="bold">VISA Configure Serial Port</text>
    
    <!-- Paramètres à gauche -->
    <text x="270" y="180" class="small-label">Port COM:</text>
    <text x="270" y="200" class="small-label">Baud Rate:</text>
    <text x="270" y="220" class="small-label">Data Bits:</text>
    <text x="270" y="240" class="small-label">Stop Bits:</text>
    
    <text x="360" y="180" class="code">"COM3"</text>
    <text x="360" y="200" class="code">9600</text>
    <text x="360" y="220" class="code">8</text>
    <text x="360" y="240" class="code">1 (10)</text>
    
    <!-- Paramètres à droite -->
    <text x="500" y="180" class="small-label">Parity:</text>
    <text x="500" y="200" class="small-label">Flow Control:</text>
    <text x="500" y="220" class="small-label">Timeout:</text>
    <text x="500" y="240" class="small-label">Term Char:</text>
    
    <text x="620" y="180" class="code">None (0)</text>
    <text x="620" y="200" class="code">None (0)</text>
    <text x="620" y="220" class="code">5000 ms</text>
    <text x="620" y="240" class="code">\n (0x0A)</text>
    
    <!-- Sorties -->
    <text x="1000" y="180" class="small-label">VISA Session Out</text>
    <text x="1000" y="220" class="small-label">Error Out</text>
    
    <!-- Flèche True vers VISA -->
    <line x1="200" y1="155" x2="250" y2="155" class="wire-green" marker-end="url(#arrowhead)"/>
    
    <!-- Flèche sortie VISA vers bas -->
    <line x1="1120" y1="190" x2="1200" y2="190" class="wire-purple"/>
    <line x1="1200" y1="190" x2="1200" y2="300" class="wire-purple" marker-end="url(#arrowhead)"/>
    
    <line x1="1120" y1="220" x2="1180" y2="220" class="wire-red"/>
    <line x1="1180" y1="220" x2="1180" y2="300" class="wire-red" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- ========== SECTION 2: WHILE LOOP ========== -->
  <g id="while-loop">
    <!-- Bordure While Loop -->
    <rect x="50" y="320" width="1300" height="1350" class="labview-grey" rx="5" stroke-dasharray="5,5"/>
    <text x="700" y="345" text-anchor="middle" class="label" font-weight="bold">WHILE LOOP (Until STOP Button)</text>
    
    <!-- ========== EVENT STRUCTURE ========== -->
    <rect x="100" y="370" width="1200" height="1200" class="labview-beige" rx="5"/>
    <text x="700" y="395" text-anchor="middle" class="label" font-weight="bold">EVENT STRUCTURE (Timeout: 100ms)</text>
    
    <!-- ===== EVENT CASE 0: LED ON ===== -->
    <g id="case-led-on">
      <rect x="130" y="420" width="550" height="200" class="labview-white" rx="3"/>
      <text x="405" y="440" text-anchor="middle" class="small-label" font-weight="bold">CASE 0: LED ON Button - Value Change</text>
      
      <!-- Commande -->
      <rect x="150" y="460" width="80" height="30" fill="#FFFACD" stroke="#DAA520"/>
      <text x="190" y="480" text-anchor="middle" class="code">"L1\n"</text>
      
      <!-- VISA Write -->
      <rect x="260" y="455" width="120" height="40" class="labview-blue" rx="3"/>
      <text x="320" y="480" text-anchor="middle" class="small-label">VISA Write</text>
      
      <!-- Wait -->
      <rect x="260" y="510" width="120" height="35" class="labview-white" rx="3"/>
      <text x="320" y="532" text-anchor="middle" class="small-label">Wait 50ms</text>
      
      <!-- VISA Read -->
      <rect x="410" y="455" width="120" height="90" class="labview-blue" rx="3"/>
      <text x="470" y="475" text-anchor="middle" class="small-label">VISA Read</text>
      <text x="470" y="492" text-anchor="middle" class="small-label">byte count: 256</text>
      
      <!-- Réponse -->
      <rect x="560" y="465" width="100" height="70" fill="#E8F4E8" stroke="#4CAF50"/>
      <text x="610" y="485" text-anchor="middle" class="small-label">Response:</text>
      <text x="610" y="505" text-anchor="middle" class="code">"LED:ON"</text>
      <text x="610" y="525" text-anchor="middle" class="small-label">→ Indicator</text>
      
      <!-- Flèches -->
      <line x1="230" y1="475" x2="260" y2="475" class="wire-orange" marker-end="url(#arrowhead)"/>
      <line x1="380" y1="475" x2="410" y2="475" class="wire-purple" marker-end="url(#arrowhead)"/>
      <line x1="320" y1="495" x2="320" y2="510" class="wire-purple"/>
      <line x1="530" y1="500" x2="560" y2="500" class="wire-orange" marker-end="url(#arrowhead)"/>
    </g>
    
    <!-- ===== EVENT CASE 1: LED OFF ===== -->
    <g id="case-led-off">
      <rect x="720" y="420" width="550" height="200" class="labview-white" rx="3"/>
      <text x="995" y="440" text-anchor="middle" class="small-label" font-weight="bold">CASE 1: LED OFF Button - Value Change</text>
      
      <!-- Commande -->
      <rect x="740" y="460" width="80" height="30" fill="#FFFACD" stroke="#DAA520"/>
      <text x="780" y="480" text-anchor="middle" class="code">"L0\n"</text>
      
      <!-- VISA Write -->
      <rect x="850" y="455" width="120" height="40" class="labview-blue" rx="3"/>
      <text x="910" y="480" text-anchor="middle" class="small-label">VISA Write</text>
      
      <!-- Wait -->
      <rect x="850" y="510" width="120" height="35" class="labview-white" rx="3"/>
      <text x="910" y="532" text-anchor="middle" class="small-label">Wait 50ms</text>
      
      <!-- VISA Read -->
      <rect x="1000" y="455" width="120" height="90" class="labview-blue" rx="3"/>
      <text x="1060" y="475" text-anchor="middle" class="small-label">VISA Read</text>
      <text x="1060" y="492" text-anchor="middle" class="small-label">byte count: 256</text>
      
      <!-- Réponse -->
      <rect x="1150" y="465" width="100" height="70" fill="#FFE8E8" stroke="#F44336"/>
      <text x="1200" y="485" text-anchor="middle" class="small-label">Response:</text>
      <text x="1200" y="505" text-anchor="middle" class="code">"LED:OFF"</text>
      <text x="1200" y="525" text-anchor="middle" class="small-label">→ Indicator</text>
      
      <!-- Flèches -->
      <line x1="820" y1="475" x2="850" y2="475" class="wire-orange" marker-end="url(#arrowhead)"/>
      <line x1="970" y1="475" x2="1000" y2="475" class="wire-purple" marker-end="url(#arrowhead)"/>
      <line x1="910" y1="495" x2="910" y2="510" class="wire-purple"/>
      <line x1="1120" y1="500" x2="1150" y2="500" class="wire-orange" marker-end="url(#arrowhead)"/>
    </g>
    
    <!-- ===== EVENT CASE 2: READ SENSOR ===== -->
    <g id="case-read-sensor">
      <rect x="130" y="650" width="550" height="250" class="labview-white" rx="3"/>
      <text x="405" y="670" text-anchor="middle" class="small-label" font-weight="bold">CASE 2: Read Sensor Button - Value Change</text>
      
      <!-- Commande -->
      <rect x="150" y="690" width="70" height="30" fill="#FFFACD" stroke="#DAA520"/>
      <text x="185" y="710" text-anchor="middle" class="code">"R\n"</text>
      
      <!-- VISA Write -->
      <rect x="250" y="685" width="110" height="40" class="labview-blue" rx="3"/>
      <text x="305" y="710" text-anchor="middle" class="small-label">VISA Write</text>
      
      <!-- Wait -->
      <rect x="250" y="740" width="110" height="35" class="labview-white" rx="3"/>
      <text x="305" y="762" text-anchor="middle" class="small-label">Wait 50ms</text>
      
      <!-- VISA Read -->
      <rect x="390" y="685" width="110" height="90" class="labview-blue" rx="3"/>
      <text x="445" y="705" text-anchor="middle" class="small-label">VISA Read</text>
      <text x="445" y="722" text-anchor="middle" class="small-label">byte count: 256</text>
      
      <!-- Parse -->
      <rect x="150" y="800" width="200" height="80" fill="#E8EAF6" stroke="#3F51B5" rx="3"/>
      <text x="250" y="825" text-anchor="middle" class="small-label" font-weight="bold">Scan From String</text>
      <text x="250" y="845" text-anchor="middle" class="code">Format: "SENSOR:%d"</text>
      <text x="250" y="865" text-anchor="middle" class="small-label">Output: I32</text>
      
      <!-- Résultat -->
      <rect x="380" y="810" width="140" height="60" fill="#E8F5E9" stroke="#4CAF50"/>
      <text x="450" y="830" text-anchor="middle" class="small-label">Sensor Value:</text>
      <text x="450" y="850" text-anchor="middle" class="code">512</text>
      <text x="450" y="867" text-anchor="middle" class="small-label">→ Indicator + Chart</text>
      
      <!-- Flèches -->
      <line x1="220" y1="705" x2="250" y2="705" class="wire-orange" marker-end="url(#arrowhead)"/>
      <line x1="360" y1="705" x2="390" y2="705" class="wire-purple" marker-end="url(#arrowhead)"/>
      <line x1="305" y1="725" x2="305" y2="740" class="wire-purple"/>
      <line x1="445" y1="775" x2="445" y2="790" class="wire-orange"/>
      <line x1="445" y1="790" x2="250" y2="790" class="wire-orange"/>
      <line x1="250" y1="790" x2="250" y2="800" class="wire-orange" marker-end="url(#arrowhead)"/>
      <line x1="350" y1="840" x2="380" y2="840" class="wire-blue" marker-end="url(#arrowhead)"/>
    </g>
    
    <!-- ===== EVENT CASE 3: GET STATUS ===== -->
    <g id="case-get-status">
      <rect x="720" y="650" width="550" height="250" class="labview-white" rx="3"/>
      <text x="995" y="670" text-anchor="middle" class="small-label" font-weight="bold">CASE 3: Get Status Button - Value Change</text>
      
      <!-- Commande -->
      <rect x="740" y="690" width="70" height="30" fill="#FFFACD" stroke="#DAA520"/>
      <text x="775" y="710" text-anchor="middle" class="code">"S\n"</text>
      
      <!-- VISA Write -->
      <rect x="840" y="685" width="110" height="40" class="labview-blue" rx="3"/>
      <text x="895" y="710" text-anchor="middle" class="small-label">VISA Write</text>
      
      <!-- Wait -->
      <rect x="840" y="740" width="110" height="35" class="labview-white" rx="3"/>
      <text x="895" y="762" text-anchor="middle" class="small-label">Wait 50ms</text>
      
      <!-- VISA Read -->
      <rect x="980" y="685" width="110" height="90" class="labview-blue" rx="3"/>
      <text x="1035" y="705" text-anchor="middle" class="small-label">VISA Read</text>
      <text x="1035" y="722" text-anchor="middle" class="small-label">byte count: 256</text>
      
      <!-- Parse -->
      <rect x="740" y="800" width="280" height="80" fill="#E8EAF6" stroke="#3F51B5" rx="3"/>
      <text x="880" y="825" text-anchor="middle" class="small-label" font-weight="bold">Scan From String</text>
      <text x="880" y="845" text-anchor="middle" class="code">Format: "STATUS:LED=%d,SENSOR=%d"</text>
      <text x="880" y="865" text-anchor="middle" class="small-label">Outputs: LED(I32), Sensor(I32)</text>
      
      <!-- Résultat -->
      <rect x="1050" y="810" width="200" height="60" fill="#E8F5E9" stroke="#4CAF50"/>
      <text x="1150" y="830" text-anchor="middle" class="small-label">LED=1, SENSOR=512</text>
      <text x="1150" y="850" text-anchor="middle" class="small-label">→ LED Indicator</text>
      <text x="1150" y="867" text-anchor="middle" class="small-label">→ Sensor Indicator</text>
      
      <!-- Flèches -->
      <line x1="810" y1="705" x2="840" y2="705" class="wire-orange" marker-end="url(#arrowhead)"/>
      <line x1="950" y1="705" x2="980" y2="705" class="wire-purple" marker-end="url(#arrowhead)"/>
      <line x1="895" y1="725" x2="895" y2="740" class="wire-purple"/>
      <line x1="1035" y1="775" x2="1035" y2="790" class="wire-orange"/>
      <line x1="1035" y1="790" x2="880" y2="790" class="wire-orange"/>
      <line x1="880" y1="790" x2="880" y2="800" class="wire-orange" marker-end="url(#arrowhead)"/>
      <line x1="1020" y1="840" x2="1050" y2="840" class="wire-blue" marker-end="url(#arrowhead)"/>
    </g>
    
    <!-- ===== EVENT CASE 4: TIMEOUT ===== -->
    <g id="case-timeout">
      <rect x="130" y="930" width="1140" height="120" class="labview-white" rx="3"/>
      <text x="700" y="955" text-anchor="middle" class="small-label" font-weight="bold">CASE 4: Timeout (Default) - 100ms</text>
      
      <!-- Wait -->
      <rect x="600" y="980" width="200" height="50" class="labview-white" rx="3" stroke="#999" stroke-width="2"/>
      <text x="700" y="1010" text-anchor="middle" class="label">Wait 100ms</text>
      <text x="700" y="1025" text-anchor="middle" class="small-label">(Prevents CPU overload)</text>
    </g>
    
    <!-- Fin Event Structure -->
    <text x="700" y="1085" text-anchor="middle" class="small-label">Error Cluster flows through all cases</text>
    
    <!-- Loop Condition -->
    <rect x="550" y="1600" width="300" height="50" class="labview-white" rx="3"/>
    <text x="700" y="1625" text-anchor="middle" class="label">Stop Button → [NOT] → Continue?</text>
    
    <line x1="700" y1="1570" x2="700" y2="1600" class="wire-green" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- ========== SECTION 3: ERROR HANDLING ========== -->
  <g id="error-handling">
    <rect x="100" y="1690" width="550" height="80" class="labview-white" rx="5"/>
    <text x="375" y="1715" text-anchor="middle" class="label" font-weight="bold">Simple Error Handler</text>
    <text x="375" y="1735" text-anchor="middle" class="small-label">• Display error dialog if error occurred</text>
    <text x="375" y="1755" text-anchor="middle" class="small-label">• Show error code and description</text>
    
    <!-- Flèche entrée -->
    <line x1="50" y1="1730" x2="100" y2="1730" class="wire-red" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- ========== SECTION 4: VISA CLOSE ========== -->
  <g id="visa-close">
    <rect x="750" y="1690" width="550" height="80" class="labview-blue" rx="5"/>
    <text x="1025" y="1715" text-anchor="middle" class="label" font-weight="bold">VISA Close</text>
    <text x="1025" y="1735" text-anchor="middle" class="small-label">• Close serial port connection</text>
    <text x="1025" y="1755" text-anchor="middle" class="small-label">• Release VISA resources</text>
    
    <!-- Flèche sortie -->
    <line x1="1300" y1="1730" x2="1350" y2="1730" class="wire-red" marker-end="url(#arrowhead)"/>
    <text x="1365" y="1735" class="small-label">[END]</text>
  </g>
  
  <!-- ========== LÉGENDE ========== -->
  <g id="legend">
    <rect x="50" y="1790" width="1300" height="0" fill="none" stroke="#999" stroke-width="1"/>
    
    <!-- Titre légende -->
    <text x="700" y="1805" text-anchor="middle" class="label" font-weight="bold">LÉGENDE - Protocole de Communication</text>
    
    <!-- Commandes -->
    <g id="legend-commands">
      <text x="150" y="1830" class="small-label" font-weight="bold">Commandes (LabVIEW → Arduino):</text>
      <rect x="150" y="1835" width="500" height="55" fill="none" stroke="#999" stroke-width="1" rx="3"/>
      
      <text x="170" y="1855" class="code">L1\n</text>
      <text x="230" y="1855" class="small-label">→ Allumer LED</text>
      
      <text x="170" y="1875" class="code">L0\n</text>
      <text x="230" y="1875" class="small-label">→ Éteindre LED</text>
      
      <text x="400" y="1855" class="code">R\n</text>
      <text x="450" y="1855" class="small-label">→ Lire capteur</text>
      
      <text x="400" y="1875" class="code">S\n</text>
      <text x="450" y="1875" class="small-label">→ Obtenir statut</text>
    </g>
    
    <!-- Réponses -->
    <g id="legend-responses">
      <text x="750" y="1830" class="small-label" font-weight="bold">Réponses (Arduino → LabVIEW):</text>
      <rect x="750" y="1835" width="550" height="55" fill="none" stroke="#999" stroke-width="1" rx="3"/>
      
      <text x="770" y="1855" class="code">LED:ON / LED:OFF</text>
      
      <text x="770" y="1875" class="code">SENSOR:xxxx</text>
      <text x="920" y="1875" class="small-label">(0-1023)</text>
      
      <text x="1040" y="1855" class="code">STATUS:LED=x,</text>
      <text x="1040" y="1870" class="code">SENSOR=yyyy</text>
    </g>
  </g>
  
  <!-- Annotation -->
  <text x="700" y="1920" text-anchor="middle" class="small-label">Configuration Série: 9600 bauds, 8 data bits, 1 stop bit, No parity, Termination: \n</text>
  <text x="700" y="1940" text-anchor="middle" class="small-label" font-style="italic">LabVIEW 2015 - Block Diagram for Arduino Communication (LED + Sensor Only)</text>
</svg>
